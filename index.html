<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}*{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>The Gap Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Karla:wght@400;500;700&display=swap">

<style>
/* Layout: pinned paper scraps on a blush corkboard. Single committed light theme. */
:root{
  --paper:#FFFBF7;
  --board:#FBE9EC;
  --board-2:#F7DCE3;
  --ink:#2E1B22;
  --ink-soft:#7A5E66;
  --pink:#D6336C;
  --pink-soft:#FFD6E2;
  --tape:#FBE7A8;
  --mint:#AFD6C4;
  --rule:#E8CFD6;
  --shadow:rgba(90,40,55,.16);
  --f-display:"Fraunces",Georgia,serif;
  --f-body:"Karla","Helvetica Neue",Arial,sans-serif;
  --f-hand:"Caveat","Bradley Hand",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--board);
  background-image:
    radial-gradient(circle at 12% 18%, rgba(255,255,255,.7) 0 2px, transparent 3px),
    radial-gradient(circle at 73% 61%, rgba(255,255,255,.55) 0 2px, transparent 3px),
    radial-gradient(circle at 36% 84%, rgba(255,255,255,.5) 0 1.5px, transparent 3px),
    linear-gradient(170deg,var(--board) 0%,var(--board-2) 100%);
  background-size:140px 140px,190px 190px,110px 110px,100% 100%;
  color:var(--ink);
  font-family:var(--f-body);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:20px 72px}

/* ---------- masthead ---------- */
.mast{
  position:relative;background:var(--paper);border:1px solid var(--rule);
  border-radius:3px;box-shadow:0 10px 24px -14px var(--shadow);
  padding:26px 22px 20px;margin-bottom:14px;
}
.mast::before,.mast::after{
  content:"";position:absolute;top:-11px;width:84px;height:24px;
  background:var(--tape);opacity:.85;box-shadow:0 2px 5px -3px var(--shadow);
}
.mast::before{left:26px;transform:rotate(-4deg)}
.mast::after{right:26px;transform:rotate(3deg)}
.eyebrow{font-family:var(--f-hand);font-size:1.35rem;color:var(--pink);line-height:1;margin:0 0 2px}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(2.1rem,7vw,3.4rem);
   line-height:.95;margin:0 0 10px;letter-spacing:-.02em;text-wrap:balance}
.dek{margin:0;max-width:60ch;color:var(--ink-soft);font-size:.98rem}
.stamp{
  display:inline-block;margin-top:14px;font-family:var(--f-body);font-weight:700;
  font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--pink);
  border:1.5px solid var(--pink);border-radius:2px;padding:4px 9px;transform:rotate(-1.5deg);
}

/* ---------- tabs ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.tab{
  font-family:var(--f-body);font-weight:700;font-size:.78rem;letter-spacing:.07em;
  text-transform:uppercase;cursor:pointer;background:var(--paper);color:var(--ink-soft);
  border:1px solid var(--rule);border-bottom-width:3px;border-radius:3px;
  padding:9px 15px;box-shadow:0 5px 14px -11px var(--shadow);
}
.tab:nth-child(1){transform:rotate(-1deg)}
.tab:nth-child(3){transform:rotate(1deg)}
.tab[aria-selected="true"]{background:var(--pink);border-color:var(--pink);color:#fff}
.tab:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}

/* ---------- paper cards ---------- */
.scrap{
  position:relative;background:var(--paper);border:1px solid var(--rule);border-radius:3px;
  box-shadow:0 12px 26px -18px var(--shadow);padding:22px;margin-bottom:16px;
}
.scrap.tilt{transform:rotate(-.35deg)}
.scrap.tilt-r{transform:rotate(.4deg)}
.scrap h2{font-family:var(--f-display);font-weight:600;font-size:1.45rem;margin:0 0 6px;letter-spacing:-.01em}
.scrap h3{font-family:var(--f-display);font-weight:600;font-size:1.1rem;margin:0 0 8px}
.note{font-family:var(--f-hand);font-size:1.22rem;color:var(--pink);line-height:1.25;margin:0 0 10px}
.muted{color:var(--ink-soft);font-size:.9rem}
.hr{height:1px;background:var(--rule);border:0;margin:18px 0}

/* ---------- quiz ---------- */
.progress{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.bar{flex:1;height:9px;background:#FAEBF0;border:1px solid var(--rule);border-radius:99px;overflow:hidden;min-width:0}
.bar span{display:block;height:100%;background:var(--pink);width:0;transition:width .3s ease}
.count{font-family:var(--f-body);font-weight:700;font-size:.74rem;letter-spacing:.1em;color:var(--ink-soft);white-space:nowrap}
.qdim{font-size:.66rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--pink);margin:0 0 8px}
.qtext{font-family:var(--f-display);font-weight:600;font-size:clamp(1.3rem,4.4vw,1.85rem);
       line-height:1.2;margin:0 0 20px;text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{
  text-align:left;cursor:pointer;font-family:var(--f-body);font-size:1rem;color:var(--ink);
  background:#fff;border:1.5px solid var(--rule);border-radius:3px;padding:16px 15px;
  box-shadow:0 6px 16px -14px var(--shadow);min-width:0;
}
.opt:hover{border-color:var(--pink);background:#FFF6F9}
.opt:focus-visible{outline:2.5px solid var(--pink);outline-offset:2px}
.opt b{display:block;font-family:var(--f-display);font-weight:600;font-size:1.08rem;margin-bottom:4px}
.opt .sub{font-size:.84rem;color:var(--ink-soft);line-height:1.4}
.opt .pick{font-family:var(--f-hand);font-size:1.1rem;color:var(--pink);display:block;margin-bottom:2px}
.scene{display:block;width:100%;height:auto;aspect-ratio:3/2;border:1px solid var(--rule);
       border-radius:2px;margin-bottom:12px;max-width:100%}
.scene-a{--i-bg:#FFEDF3;--i-1:#E8679A;--i-2:#F9CBDC;--i-3:#C92E64;--i-ink:#4A2430}
.scene-b{--i-bg:#E6F2EC;--i-1:#5FA98B;--i-2:#BFDFCF;--i-3:#2C7458;--i-ink:#22413A}
.opt[data-v="B"] .pick{color:#2C7458}
.opt[data-v="B"]:hover{border-color:#3F8D6E;background:#F3FAF6}
.backlink{background:none;border:0;cursor:pointer;color:var(--ink-soft);font-family:var(--f-body);
          font-size:.82rem;padding:0;margin-top:16px;text-decoration:underline}

/* ---------- reveal (industry) ---------- */
.reveal{border-left:4px solid var(--pink);background:#FFF4F7;padding:16px 16px 16px 15px;border-radius:3px;margin-top:18px}
.reveal .lead{font-family:var(--f-display);font-weight:600;font-size:1.05rem;margin:0 0 10px}
textarea{
  width:100%;min-height:86px;font-family:var(--f-body);font-size:.95rem;color:var(--ink);
  background:#fff;border:1.5px solid var(--rule);border-radius:3px;padding:11px;resize:vertical;
}
textarea:focus-visible,input:focus-visible{outline:2.5px solid var(--pink);outline-offset:1px}

/* ---------- split bars ---------- */
.split{margin:10px 0 14px}
.split-row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.split-key{width:92px;flex:none;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
@media(max-width:480px){.split-key{width:64px;font-size:.62rem}}
.split-track{flex:1;min-width:0;height:26px;background:var(--pink-soft);border-radius:2px;display:flex;overflow:hidden;border:1px solid var(--rule)}
.split-a{background:var(--pink);height:100%}
.split-b{background:var(--mint);height:100%}
.split-track span{display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;
                  color:#fff;font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap}
.split-b span{color:#1F3D33}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.76rem;color:var(--ink-soft);margin-top:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* ---------- scorecard ---------- */
.score-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.score{background:#fff;border:1px solid var(--rule);border-radius:3px;padding:15px;min-width:0}
.score .n{font-family:var(--f-display);font-weight:900;font-size:2.2rem;line-height:1;color:var(--pink);
          font-variant-numeric:tabular-nums}
.score .l{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-top:7px}
.score .d{font-size:.8rem;color:var(--ink-soft);margin-top:5px;line-height:1.35}

/* ---------- dimension bars ---------- */
.dim{margin-bottom:15px}
.dim-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:5px}
.dim-head b{font-family:var(--f-display);font-weight:600;font-size:1rem}
.dim-head em{font-style:normal;font-size:.75rem;font-weight:700;color:var(--pink);font-variant-numeric:tabular-nums;white-space:nowrap}
.dim-track{height:12px;background:var(--pink-soft);border-radius:99px;overflow:hidden}
.dim-fill{height:100%;background:linear-gradient(90deg,var(--mint),var(--pink))}
.dim-note{font-size:.8rem;color:var(--ink-soft);margin-top:4px}

/* ---------- table ---------- */
.tscroll{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.86rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:.64rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-soft)}
td.num{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
tr.hot td.num{color:var(--pink)}

/* ---------- forms / buttons ---------- */
.btn{
  font-family:var(--f-body);font-weight:700;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;
  cursor:pointer;background:var(--pink);color:#fff;border:0;border-radius:3px;padding:12px 20px;
  box-shadow:0 7px 16px -10px var(--shadow);
}
.btn:hover{background:#B82A5B}
.btn:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--pink);border:1.5px solid var(--pink)}
.btn.ghost:hover{background:var(--pink-soft)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
input[type=email],input[type=text]{
  flex:1;min-width:190px;font-family:var(--f-body);font-size:.95rem;color:var(--ink);background:#fff;
  border:1.5px solid var(--rule);border-radius:3px;padding:12px;
}
label.fl{display:block;font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
         color:var(--ink-soft);margin-bottom:6px}
.ok{font-family:var(--f-hand);font-size:1.25rem;color:var(--pink);margin-top:10px}

/* ---------- misc ---------- */
.pin{position:absolute;top:-7px;left:50%;width:14px;height:14px;border-radius:50%;
     background:var(--pink);box-shadow:0 2px 4px -1px var(--shadow);transform:translateX(-50%)}
.toggle{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--ink-soft);cursor:pointer}
.foot{text-align:center;font-family:var(--f-hand);font-size:1.15rem;color:var(--ink-soft);margin-top:26px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">

  <header class="mast">
    <p class="eyebrow">Marketing Club presents</p>
    <h1>The Gap</h1>
    <p class="dek">Eighteen questions with no right answer. Campus answers them. Industry answers them. We publish where the two disagree.</p>
    <span class="stamp">Field study &middot; GLC 4.0</span>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-campus" aria-selected="true" aria-controls="view-campus">I'm a student</button>
    <button class="tab" role="tab" id="tab-industry" aria-selected="false" aria-controls="view-industry">I'm from industry</button>
    <button class="tab" role="tab" id="tab-research" aria-selected="false" aria-controls="view-research">The research</button>
  </div>

  <section id="view-campus" role="tabpanel" aria-labelledby="tab-campus"></section>
  <section id="view-industry" role="tabpanel" aria-labelledby="tab-industry" hidden></section>
  <section id="view-research" role="tabpanel" aria-labelledby="tab-research" hidden></section>

  <p class="foot">pinned together by the Marketing Club</p>
</div>

<script>
/* ============================ QUESTIONS ============================ */
const DIMS = {
  brand:  "Brand vs Performance",
  trust:  "Trust & Authority",
  risk:   "Risk Appetite",
  channel:"Channel Philosophy",
  proof:  "Measurement & Proof"
};

/* seedI / seedC = share picking option A, in the sample baseline only.
   These are placeholders for the club's own collected data. */
const Q = [
{id:"q1",dim:"brand",t:"One loyal customer for ten years, or ten million people who watch once and forget?",
 a:{l:"The loyal customer",s:"Depth over reach. Retention is the business."},
 b:{l:"The ten million",s:"Reach creates everything else downstream."},
 seedI:71,seedC:38,
 why:"Campus leans toward reach here. What do they see about attention today that your retention models might be slow to price in?"},

{id:"q2",dim:"trust",t:"A product recommendation lands harder from the brand, or from a creator you follow?",
 a:{l:"The brand",s:"It carries accountability and a track record."},
 b:{l:"The creator",s:"A person can be trusted; a logo can't."},
 seedI:52,seedC:12,
 why:"Campus overwhelmingly trusts the creator. What does that cost a brand that has spent decades building its own name?"},

{id:"q3",dim:"brand",t:"Brand loyalty in 2026 — real preference, or just friction nobody bothered to remove?",
 a:{l:"Real preference",s:"People genuinely want the brands they want."},
 b:{l:"Mostly friction",s:"Habit, defaults and switching cost dressed up as love."},
 seedI:64,seedC:27,
 why:"Campus calls most loyalty friction. If they're right, what in your current loyalty spend is buying nothing?"},

{id:"q4",dim:"risk",t:"You can fix the product or fix the message. Budget for one.",
 a:{l:"Fix the product",s:"Marketing can't outrun a bad experience."},
 b:{l:"Fix the message",s:"Great products die of bad positioning every day."},
 seedI:58,seedC:81,
 why:"Campus goes harder on the product than industry does. What have you seen a message actually rescue?"},

{id:"q5",dim:"proof",t:"Quarter closes in three weeks and you're short. Cut brand spend?",
 a:{l:"Cut it",s:"The number is the number. Brand recovers."},
 b:{l:"Protect it",s:"You'd be eating next year to pay for this one."},
 seedI:44,seedC:19,
 why:"Campus protects brand spend far more readily. Is that naivety about quarterly pressure, or clarity you lose once you're inside it?"},

{id:"q6",dim:"risk",t:"AI-generated creative in a flagship campaign — ship it or don't?",
 a:{l:"Ship it",s:"If the work is good, the tool doesn't matter."},
 b:{l:"Don't",s:"The audience will find out, and that's the story."},
 seedI:49,seedC:66,
 why:"Campus is more comfortable shipping AI creative than industry is. They're also the audience. What does that tell you?"},

{id:"q7",dim:"channel",t:"Be present on every platform, or own one completely?",
 a:{l:"Every platform",s:"You can't win where you aren't."},
 b:{l:"Own one",s:"Spread thin is the same as absent."},
 seedI:41,seedC:74,
 why:"Campus wants concentration. What breaks when a brand your size picks one platform and ignores the rest?"},

{id:"q8",dim:"trust",t:"Twenty lakh on one celebrity, or twenty lakh across two hundred micro-creators?",
 a:{l:"The celebrity",s:"One name, instant scale, controlled message."},
 b:{l:"Two hundred creators",s:"Two hundred rooms you'd otherwise never enter."},
 seedI:46,seedC:17,
 why:"Campus splits the money. What's the operational reason that's harder than it sounds?"},

{id:"q9",dim:"risk",t:"Polished studio film, or a shaky phone video shot by an actual customer?",
 a:{l:"The polished film",s:"Production value signals the brand is serious."},
 b:{l:"The phone video",s:"Rough reads as true. Polish reads as paid."},
 seedI:55,seedC:21,
 why:"Campus reads polish as a tell. At what point does low production stop signalling honesty and start signalling a brand that's given up?"},

{id:"q10",dim:"risk",t:"Should a brand take a public position on a divisive social issue?",
 a:{l:"Yes, take it",s:"Silence is a position too, and people read it."},
 b:{l:"Stay out",s:"You'll lose half the room and convince nobody."},
 seedI:34,seedC:63,
 why:"Campus wants brands to speak. What have you watched go wrong when they do?"},

{id:"q11",dim:"proof",t:"Something went viral. Strategy, or luck you'll take credit for?",
 a:{l:"Strategy",s:"It's repeatable if you know what you did."},
 b:{l:"Luck",s:"Nobody has reproduced it on demand, ever."},
 seedI:57,seedC:29,
 why:"Campus calls virality luck. If they're right, what should a content budget actually be buying?"},

{id:"q12",dim:"channel",t:"Build your own channel, or go where the audience already is?",
 a:{l:"Build your own",s:"A rented audience can be taken away overnight."},
 b:{l:"Go where they are",s:"Nobody is opening your app. They're on their feed."},
 seedI:62,seedC:33,
 why:"Campus says go to the feed. How long do you think an owned channel stays worth the cost of building it?"},

{id:"q13",dim:"proof",t:"Marketing spend you cannot attribute — investment, or waste?",
 a:{l:"Investment",s:"The most valuable effects are the hardest to measure."},
 b:{l:"Waste",s:"If you can't see it working, you can't claim it is."},
 seedI:69,seedC:42,
 why:"Campus is more willing to call unmeasured spend waste than industry is. Are they being rigorous, or missing something?"},

{id:"q14",dim:"brand",t:"Discount to win a new customer, or hold price and lose them?",
 a:{l:"Discount",s:"Get them in. Make the margin back later."},
 b:{l:"Hold price",s:"A discount-acquired customer leaves at the next discount."},
 seedI:37,seedC:58,
 why:"Campus discounts more readily. What does a generation raised on coupon codes understand about price that your models may not?"},

{id:"q15",dim:"trust",t:"Founder as the face of the brand — asset or liability?",
 a:{l:"Asset",s:"People follow people. It's the cheapest trust you'll ever buy."},
 b:{l:"Liability",s:"You've tied company valuation to one person's worst day."},
 seedI:48,seedC:72,
 why:"Campus sees the founder as an asset. What's the risk they haven't had to live through yet?"},

{id:"q16",dim:"brand",t:"Nostalgia campaigns — a real strategy, or running out of ideas?",
 a:{l:"Real strategy",s:"Memory is the cheapest shortcut to feeling."},
 b:{l:"Out of ideas",s:"It's borrowing equity instead of building any."},
 seedI:66,seedC:44,
 why:"Campus is more sceptical of nostalgia than industry is — and much of it is aimed at them. Why might it be landing differently than intended?"},

{id:"q17",dim:"trust",t:"Do people actually care about data privacy, or only say they do?",
 a:{l:"They actually care",s:"The behaviour is changing, slowly but it's changing."},
 b:{l:"Only say it",s:"Stated preference, revealed preference. They click accept."},
 seedI:31,seedC:56,
 why:"Campus says people genuinely care. They're the ones being tracked. What would change in your stack if they're right?"},

{id:"q18",dim:"channel",t:"Launch rough and fix it in public, or hold until it's finished?",
 a:{l:"Launch rough",s:"The market tells you things no internal review will."},
 b:{l:"Hold it",s:"You only get one first impression and it's permanent."},
 seedI:53,seedC:76,
 why:"Campus is far more willing to launch unfinished. Is that speed you've lost, or a lesson they haven't had yet?"}
];

/* ============================ SCENES ============================ */
/* Flat cut-paper illustrations, 120x80. Colour comes from CSS vars so the
   same scene language reads pink on option A and green on option B. */
const C1='var(--i-1)',C2='var(--i-2)',C3='var(--i-3)',CK='var(--i-ink)',CB='var(--i-bg)';
const P=(x,y,r,c,h)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/><path d="M${x-1.5*r} ${h}a${1.5*r} ${1.9*r} 0 0 1 ${3*r} 0z" fill="${c}"/>`;
const G=`<rect width="120" height="80" fill="${CB}"/><rect y="66" width="120" height="14" fill="${C2}"/>`;
const DESK=`<rect x="12" y="53" width="96" height="5" fill="${CK}" opacity=".28"/>`;
const STAGE=`<rect x="32" y="56" width="56" height="6" fill="${CK}" opacity=".28"/>`;

const SCENES={
/* 1 — loyal customer / heavy crowd */
q1a:G+`<rect x="74" y="10" width="42" height="3.5" fill="${C2}"/><rect x="80" y="2" width="7" height="8" fill="${C2}"/><rect x="91" y="0" width="7" height="10" fill="${C2}"/><rect x="102" y="3" width="7" height="7" fill="${C2}"/>`
 +P(96,44,7,C1,64)+`<rect x="48" y="50" width="34" height="16" rx="2" fill="${C3}"/><rect x="45" y="45" width="40" height="5" rx="2" fill="${CK}" opacity=".3"/>`
 +P(28,44,7.5,C3,66)+`<path d="M62 25c-2.4-2.6-6.6-.9-6.6 2.2 0 3 4.3 5.7 6.6 7.2 2.3-1.5 6.6-4.2 6.6-7.2 0-3.1-4.2-4.8-6.6-2.2z" fill="${C1}"/>`,
q1b:G+`<rect x="6" y="8" width="108" height="3.5" fill="${C2}"/>`
 +P(14,40,5,C2,58)+P(32,38,5,C2,58)+P(50,40,5,C2,58)+P(68,38,5,C2,58)+P(86,40,5,C2,58)+P(104,38,5,C2,58)
 +P(16,46,6.5,C1,70)+P(40,44,6.5,C3,70)+P(62,46,6.5,C1,70)+P(84,44,6.5,C3,70)+P(106,46,6.5,C1,70),

/* 2 — the brand / the creator */

  const key=qid+slot;
  return `<svg class="scene scene-${slot}" viewBox="0 0 120 80" role="img" aria-hidden="true" focusable="false">${SCENES[key]||G}</svg>`;
}

/* ======================= SAMPLE BASELINE DATA ======================= */
/* Clearly-labelled synthetic respondents so the dashboard is readable before
   the club collects anything. Toggle off in the research view. */
function buildSample(role,n,key){
  const out=[];let s=role==="campus"?7919:3301;
  const rnd=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};
  for(let i=0;i<n;i++){
    const ans={};
    Q.forEach(q=>{ans[q.id]=rnd()*100<q[key]?"A":"B";});
    out.push({role,answers:ans,why:{},sample:true});
  }
  return out;
}
const SAMPLE=[...buildSample("campus",312,"seedC"),...buildSample("industry",41,"seedI")];

/* ============================ STORAGE ============================ */
/* Writes go to a Google Form (no sign-in, no permissions). The form fills a
   spreadsheet. Reads come from a published CSV of that sheet with the email
   column stripped out, so no address is ever at a public URL. */

const FORM_POST = "https://docs.google.com/forms/d/e/1FAIpQLSdB4ZeP0T0UXx_EQTfKDHv8XBlhuMAvy9Dnv61jUwMJA-cZBQ/formResponse";
const FIELD = {id:"entry.1721217034", role:"entry.698237970",
               answers:"entry.188983558", why:"entry.661385786", email:"entry.1365055442"};
/* Published CSV of the Public sheet. Blank = writes still work, dashboard
   shows only this device until it's filled in. */
const CSV_URL = "";

const KEY="gapstudy_v1";
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):[];}catch(e){return [];}}
function save(list){try{localStorage.setItem(KEY,JSON.stringify(list));}catch(e){}}
let LOCAL=load();
let REMOTE=[],lastSent=null,shareState="connecting",currentTab="campus";

const QORDER=["q1","q2","q3","q4","q5","q6","q7","q8","q9","q10","q11","q12","q13","q14","q15","q16","q17","q18"];
const packAnswers=a=>QORDER.map(q=>a[q]||"-").join("");
const unpackAnswers=s=>{const o={};QORDER.forEach((q,i)=>{const c=(s||"")[i];if(c==="A"||c==="B")o[q]=c;});return o;};

function send(fields){
  const body=new URLSearchParams();
  Object.keys(fields).forEach(k=>body.append(FIELD[k],fields[k]));
  return fetch(FORM_POST,{method:"POST",mode:"no-cors",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},body:body.toString()});
}

async function addResponse(r){
  r.id="r_"+Date.now()+"_"+Math.random().toString(36).slice(2,8);
  try{
    await send({id:r.id,role:r.role,answers:packAnswers(r.answers||{}),
                why:JSON.stringify(r.why||{}),email:""});
    lastSent=r;
    REMOTE.push({id:r.id,role:r.role,answers:r.answers||{},why:r.why||{}});
    return;
  }catch(e){}
  lastSent=null;LOCAL.push(r);save(LOCAL);
}

async function attachEmail(v){
  if(lastSent){
    try{
      await send({id:lastSent.id+"_email",role:lastSent.role,
                  answers:packAnswers(lastSent.answers||{}),why:"",email:v});
      return;
    }catch(e){}
  }
  const list=load();if(list.length){list[list.length-1].email=v;save(list);LOCAL=list;}
}

/* --- read back --- */
function parseCSV(text){
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===","){row.push(cell);cell="";}
    else if(c==="\n"){row.push(cell);rows.push(row);row=[];cell="";}
    else if(c!=="\r") cell+=c;
  }
  if(cell.length||row.length){row.push(cell);rows.push(row);}
  return rows;
}

async function refresh(){
  if(!/^https:\/\//.test(CSV_URL)){shareState="off";return;}
  try{
    const r=await fetch(CSV_URL+(CSV_URL.indexOf("?")<0?"?":"&")+"t="+Date.now());
    const rows=parseCSV(await r.text());
    const out=[];
    rows.slice(1).forEach(c=>{
      const id=(c[0]||"").trim(),role=(c[1]||"").trim(),ans=(c[2]||"").trim();
      if(role!=="campus"&&role!=="industry")return;
      if(/_email$/.test(id))return;
      let why={};try{why=JSON.parse(c[3]||"{}")||{};}catch(e){}
      out.push({id,role,answers:unpackAnswers(ans),why});
    });
    REMOTE=out;shareState="on";
  }catch(e){shareState="off";}
  if(currentTab==="research")renderResearch();
}

refresh();
setInterval(refresh,20000);

/* ============================ HELPERS ============================ */
const el=(h)=>{const d=document.createElement("div");d.innerHTML=h.trim();return d.firstElementChild;};
const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function collected(){return [...REMOTE,...LOCAL];}
function pool(includeSample){
  return includeSample?[...SAMPLE,...collected()]:collected();
}
function pctA(rows,qid){
  const v=rows.filter(r=>r.answers&&r.answers[qid]);
  if(!v.length)return null;
  return Math.round(v.filter(r=>r.answers[qid]==="A").length/v.length*100);
}
function splitBar(label,p,na){
  if(p===null)return `<div class="split-row"><div class="split-key">${label}</div>
    <div class="split-track"><span style="flex:1;color:var(--ink-soft)">no responses yet</span></div></div>`;
  return `<div class="split-row"><div class="split-key">${label}</div>
    <div class="split-track">
      <div class="split-a" style="width:${p}%"><span>${p>13?p+"%":""}</span></div>
      <div class="split-b" style="width:${100-p}%"><span>${100-p>13?(100-p)+"%":""}</span></div>
    </div></div>`;
}

/* ============================ QUIZ ENGINE ============================ */
function Quiz(role,mount){
  let i=0;const answers={};const why={};
  const isInd=role==="industry";

  function render(){
    if(i>=Q.length){return results();}
    const q=Q[i];
    mount.innerHTML="";
    const card=el(`<div class="scrap ${i%2?"tilt-r":"tilt"}">
      <div class="progress">
        <div class="bar"><span style="width:${(i/Q.length)*100}%"></span></div>
        <div class="count">${String(i+1).padStart(2,"0")} / ${Q.length}</div>
      </div>
      <p class="qdim">${esc(DIMS[q.dim])}</p>
      <p class="qtext">${esc(q.t)}</p>
      <div class="opts">
        <button class="opt" data-v="A">${scene(q.id,"a")}
          <span class="pick">option A</span><b>${esc(q.a.l)}</b><span class="sub">${esc(q.a.s)}</span></button>
        <button class="opt" data-v="B">${scene(q.id,"b")}
          <span class="pick">option B</span><b>${esc(q.b.l)}</b><span class="sub">${esc(q.b.s)}</span></button>
      </div>
      <div class="slot"></div>
      ${i>0?'<button class="backlink" data-back>&larr; back one</button>':""}
    </div>`);
    mount.appendChild(card);
    card.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>pick(q,b.dataset.v,card)));
    const back=card.querySelector("[data-back]");
    if(back)back.addEventListener("click",()=>{i--;render();});
    card.scrollIntoView({block:"nearest"});
  }

  function pick(q,v,card){
    answers[q.id]=v;
    const rows=pool(true);
    const campus=pctA(rows.filter(r=>r.role==="campus"),q.id);
    const diverges = campus!==null && ((v==="A"&&campus<45)||(v==="B"&&campus>55));

    if(isInd&&diverges){
      card.querySelectorAll(".opt").forEach(b=>b.disabled=true);
      const slot=card.querySelector(".slot");
      slot.innerHTML=`<div class="reveal">
        <p class="lead">You picked ${v}. Campus went the other way — ${v==="A"?100-campus:campus}% of them.</p>
        <div class="split">${splitBar("Campus",campus)}</div>
        <p style="margin:0 0 9px;font-size:.93rem">${esc(q.why)}</p>
        <label class="fl" for="why-${q.id}">Your read</label>
        <textarea id="why-${q.id}" placeholder="A sentence is plenty."></textarea>
        <div class="row"><button class="btn" data-next>Next question</button>
        <button class="btn ghost" data-skip>Skip</button></div>
      </div>`;
      const ta=slot.querySelector("textarea");
      slot.querySelector("[data-next]").addEventListener("click",()=>{why[q.id]=ta.value.trim();i++;render();});
      slot.querySelector("[data-skip]").addEventListener("click",()=>{i++;render();});
      ta.focus();
    }else{i++;render();}
  }

  function results(){
    const rows=pool(true);
    const indRows=rows.filter(r=>r.role==="industry");
    const camRows=rows.filter(r=>r.role==="campus");
    const compareTo=isInd?camRows:indRows;
    const otherName=isInd?"campus":"industry";

    let matched=0,scored=0;
    const perDim={};Object.keys(DIMS).forEach(k=>perDim[k]={gap:0,n:0});
    const lines=[];
    Q.forEach(q=>{
      const o=pctA(compareTo,q.id);if(o===null)return;
      const mine=answers[q.id];
      const majority=o>=50?"A":"B";
      scored++;if(mine===majority)matched++;
      const dist=mine==="A"?100-o:o;
      perDim[q.dim].gap+=dist;perDim[q.dim].n++;
      lines.push({q,o,mine,dist});
    });
    const align=scored?Math.round(matched/scored*100):0;
    lines.sort((a,b)=>b.dist-a.dist);
    const top=lines.slice(0,4);

    addResponse({role,answers,why,ts:Date.now()});

    const dimHtml=Object.keys(DIMS).map(k=>{
      const d=perDim[k];if(!d.n)return "";
      const avg=Math.round(d.gap/d.n);
      return `<div class="dim">
        <div class="dim-head"><b>${esc(DIMS[k])}</b><em>${avg}% apart</em></div>
        <div class="dim-track"><div class="dim-fill" style="width:${avg}%"></div></div>
        <p class="dim-note">${avg>55?"You sit on the opposite side of "+otherName+" here.":avg>40?"Split down the middle.":"You and "+otherName+" broadly agree."}</p>
      </div>`;}).join("");

    const topHtml=top.map(x=>`<div class="scrap" style="padding:16px;margin-bottom:10px;box-shadow:none">
        <p class="qdim">${esc(DIMS[x.q.dim])}</p>
        <h3 style="font-size:1rem;margin-bottom:9px">${esc(x.q.t)}</h3>
        <p class="muted" style="margin:0 0 8px">You said <b style="color:var(--pink)">${esc(x.mine==="A"?x.q.a.l:x.q.b.l)}</b>.
        ${x.dist}% of ${otherName} said the opposite.</p>
        <div class="split">${splitBar(otherName==="campus"?"Campus":"Industry",x.o)}</div>
      </div>`).join("");

    mount.innerHTML="";
    mount.appendChild(el(`<div class="scrap tilt">
      <p class="note">done &mdash; here's where you landed</p>
      <h2>${isInd?"You against 300+ students":"You against the industry room"}</h2>
      <div class="score-grid">
        <div class="score"><div class="n">${align}%</div><div class="l">Alignment</div>
          <div class="d">You matched the ${otherName} majority on ${matched} of ${scored} questions.</div></div>
        <div class="score"><div class="n">${top.length?top[0].dist:0}%</div><div class="l">Widest gap</div>
          <div class="d">On your single most contrarian answer.</div></div>
        <div class="score"><div class="n">${Q.length}</div><div class="l">Questions</div>
          <div class="d">Five dimensions, no right answers.</div></div>
      </div>
      <div class="legend"><span><i style="background:var(--pink)"></i>Option A</span><span><i style="background:var(--mint)"></i>Option B</span></div>
      <hr class="hr">
      <h3>Where you diverge most</h3>
      ${topHtml||'<p class="muted">Not enough comparison data yet.</p>'}
      <hr class="hr">
      <h3>By dimension</h3>
      ${dimHtml}
    </div>`));

    mount.appendChild(emailCard());
    mount.appendChild(el(`<div class="scrap tilt-r"><h3>Compare everyone</h3>
      <p class="muted" style="margin-bottom:12px">Your answers are in. The full campus-versus-industry picture lives in the research view.</p>
      <button class="btn ghost" id="goresearch">Open the research</button></div>`));
    document.getElementById("goresearch").addEventListener("click",()=>switchTab("research"));
    mount.scrollIntoView({block:"start",behavior:"smooth"});
  }

  render();
}

/* ============================ EMAIL CARD ============================ */
function emailCard(){
  const c=el(`<div class="scrap tilt-r">
    <p class="note">want the findings?</p>
    <h2>We'll send you the study</h2>
    <p class="muted">When collection closes we publish the full campus-versus-industry report. Drop your email and we'll send it across.</p>
    <div class="row">
      <input type="email" id="em" placeholder="you@company.com" autocomplete="email">
      <button class="btn" id="emgo">Send it to me</button>
    </div>
    <div id="emmsg"></div>
  </div>`);
  c.querySelector("#emgo").addEventListener("click",async()=>{
    const v=c.querySelector("#em").value.trim();
    const msg=c.querySelector("#emmsg");
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){msg.innerHTML='<p class="muted" style="margin-top:10px">That address doesn\'t look right — check it and try again.</p>';return;}
    await attachEmail(v);
    msg.innerHTML='<p class="ok">Got it. We\'ll be in touch when the study is out.</p>';
    c.querySelector("#em").disabled=true;c.querySelector("#emgo").disabled=true;
  });
  return c;
}

/* ============================ VIEWS ============================ */
function renderCampus(){
  const v=document.getElementById("view-campus");
  v.innerHTML="";
  const intro=el(`<div class="scrap tilt">
    <p class="note">eighteen questions, two minutes</p>
    <h2>Do you think like a CMO yet?</h2>
    <p>Every question has two defensible answers and no correct one. Pick fast — your first instinct is the data we want.</p>
    <p class="muted" style="margin-top:10px">At the end you'll see your answers against the senior marketers who took the same set.</p>
    <div class="row"><button class="btn" id="startc">Start</button></div>
  </div>`);
  v.appendChild(intro);
  document.getElementById("startc").addEventListener("click",()=>Quiz("campus",v));
}

function renderIndustry(){
  const v=document.getElementById("view-industry");
  v.innerHTML="";
  const camN=pool(true).filter(r=>r.role==="campus").length;
  const intro=el(`<div class="scrap tilt">
    <p class="note">same eighteen questions</p>
    <h2>${camN} students have already answered these</h2>
    <p>Pick your side on each. Where you and campus split, we'll show you the number and ask you one question about it.</p>
    <p class="muted" style="margin-top:10px">Takes about four minutes. Your answers join the industry side of the study.</p>
    <div class="row"><button class="btn" id="starti">Start</button></div>
  </div>`);
  v.appendChild(intro);
  document.getElementById("starti").addEventListener("click",()=>Quiz("industry",v));
}

let includeSample=true;
function renderResearch(){
  const v=document.getElementById("view-research");
  const rows=pool(includeSample);
  const cam=rows.filter(r=>r.role==="campus"),ind=rows.filter(r=>r.role==="industry");
  const mine=collected().length;

  const data=Q.map(q=>{
    const c=pctA(cam,q.id),i=pctA(ind,q.id);
    return {q,c,i,gap:(c!==null&&i!==null)?Math.abs(c-i):null};
  });
  const ranked=data.filter(d=>d.gap!==null).sort((a,b)=>b.gap-a.gap);
  const avgGap=ranked.length?Math.round(ranked.reduce((s,d)=>s+d.gap,0)/ranked.length):0;

  const dimScores=Object.keys(DIMS).map(k=>{
    const set=ranked.filter(d=>d.q.dim===k);
    return {k,avg:set.length?Math.round(set.reduce((s,d)=>s+d.gap,0)/set.length):0,n:set.length};
  }).sort((a,b)=>b.avg-a.avg);

  const whys=LOCAL.filter(r=>r.role==="industry").flatMap(r=>
    Object.entries(r.why||{}).filter(([,t])=>t&&t.length).map(([qid,t])=>({qid,t})));

  v.innerHTML="";

  v.appendChild(el(`<div class="scrap tilt">
    <p class="note">live, updating as people answer</p>
    <h2>Campus vs Industry</h2>
    <div class="score-grid">
      <div class="score"><div class="n">${cam.length}</div><div class="l">Campus responses</div></div>
      <div class="score"><div class="n">${ind.length}</div><div class="l">Industry responses</div></div>
      <div class="score"><div class="n">${avgGap}pt</div><div class="l">Mean divergence</div>
        <div class="d">Average distance between the two groups across all ${ranked.length} questions.</div></div>
      <div class="score"><div class="n">${ranked.filter(d=>d.gap>=30).length}</div><div class="l">Hard splits</div>
        <div class="d">Questions where the groups are 30+ points apart.</div></div>
    </div>
    <label class="toggle"><input type="checkbox" id="smp" ${includeSample?"checked":""}> Include the sample baseline dataset</label>
    <p class="muted" style="margin-top:6px;font-size:.8rem">The baseline is placeholder data so the dashboard reads properly before collection. Untick it to see only real responses.</p>
    <p class="muted" style="margin-top:10px;font-size:.8rem"><b>Shared store:</b> ${
      shareState==="on"?`saving to your Google Sheet &mdash; ${REMOTE.length} response${REMOTE.length===1?"":"s"} saved for everyone`
      :shareState==="connecting"?"connecting&hellip;"
      :"live totals not switched on yet &mdash; votes are still being saved"}</p>
  </div>`));
  document.getElementById("smp").addEventListener("change",e=>{includeSample=e.target.checked;renderResearch();});

  v.appendChild(el(`<div class="scrap tilt-r">
    <h2>Divergence index</h2>
    <p class="muted">Each question scored on the absolute distance between the two groups' choice of option A. Anything above 30 points is a genuine split rather than noise.</p>
    ${ranked.slice(0,6).map(d=>`
      <div style="margin:16px 0 20px">
        <div class="dim-head"><b>${esc(d.q.t)}</b><em>${d.gap} pt gap</em></div>
        <p class="muted" style="margin:2px 0 8px;font-size:.8rem">A = ${esc(d.q.a.l)} &nbsp;&middot;&nbsp; B = ${esc(d.q.b.l)}</p>
        ${splitBar("Campus",d.c)}${splitBar("Industry",d.i)}
      </div>`).join("")||'<p class="muted">No responses yet.</p>'}
    <div class="legend"><span><i style="background:var(--pink)"></i>Option A</span><span><i style="background:var(--mint)"></i>Option B</span></div>
  </div>`));

  v.appendChild(el(`<div class="scrap tilt">
    <h2>Where the thinking splits</h2>
    <p class="muted">Mean divergence grouped by dimension. The top row is where campus and industry are furthest apart in how they reason, not just what they answer.</p>
    <div style="margin-top:16px">
    ${dimScores.map(d=>`<div class="dim">
      <div class="dim-head"><b>${esc(DIMS[d.k])}</b><em>${d.avg} pt</em></div>
      <div class="dim-track"><div class="dim-fill" style="width:${Math.min(d.avg*1.6,100)}%"></div></div>
      <p class="dim-note">${d.n} question${d.n===1?"":"s"}</p>
    </div>`).join("")}
    </div>
  </div>`));

  v.appendChild(el(`<div class="scrap tilt-r">
    <h2>Full question set</h2>
    <div class="tscroll"><table>
      <thead><tr><th>Question</th><th>Dimension</th><th>Campus A</th><th>Industry A</th><th>Gap</th></tr></thead>
      <tbody>${data.map(d=>`<tr class="${d.gap>=30?"hot":""}">
        <td>${esc(d.q.t)}</td><td>${esc(DIMS[d.q.dim])}</td>
        <td class="num">${d.c===null?"—":d.c+"%"}</td>
        <td class="num">${d.i===null?"—":d.i+"%"}</td>
        <td class="num">${d.gap===null?"—":d.gap+" pt"}</td></tr>`).join("")}</tbody>
    </table></div>
  </div>`));

  if(whys.length){
    v.appendChild(el(`<div class="scrap tilt">
      <h2>What industry said about the gaps</h2>
      <p class="muted">Collected when a leader's answer went against the campus majority.</p>
      ${whys.map(w=>{const q=Q.find(x=>x.id===w.qid);return `<div style="border-left:3px solid var(--pink);padding-left:13px;margin-top:15px">
        <p class="muted" style="margin:0 0 4px;font-size:.8rem">${esc(q?q.t:w.qid)}</p>
        <p style="margin:0">&ldquo;${esc(w.t)}&rdquo;</p></div>`;}).join("")}
    </div>`));
  }

  v.appendChild(el(`<div class="scrap tilt-r">
    <h2>Export</h2>
    <p class="muted">${mine} real response${mine===1?"":"s"} so far${LOCAL.length?` (${LOCAL.length} of them saved only on this browser)`:""}. Copy them as JSON to pull into your analysis.</p>
    <div class="row"><button class="btn ghost" id="cp">Copy raw responses</button><span id="cpmsg" class="ok" style="margin:0"></span></div>
  </div>`));
  document.getElementById("cp").addEventListener("click",async()=>{
    const txt=JSON.stringify(collected(),null,2);const m=document.getElementById("cpmsg");
    try{await navigator.clipboard.writeText(txt);m.textContent="copied";}
    catch(e){
      const ta=document.createElement("textarea");ta.value=txt;ta.style.width="100%";ta.style.minHeight="160px";
      document.getElementById("cp").parentElement.after(ta);ta.select();m.textContent="select and copy";
    }
  });

  v.appendChild(emailCard());
}

/* ============================ TABS ============================ */
const VIEWS={campus:renderCampus,industry:renderIndustry,research:renderResearch};
const rendered={};
function switchTab(name){
  currentTab=name;
  ["campus","industry","research"].forEach(n=>{
    const t=document.getElementById("tab-"+n),p=document.getElementById("view-"+n);
    const on=n===name;t.setAttribute("aria-selected",on?"true":"false");p.hidden=!on;
  });
  if(name==="research"){renderResearch();}
  else if(!rendered[name]){VIEWS[name]();rendered[name]=true;}
  try{history.replaceState(null,"","#"+name);}catch(e){}
  window.scrollTo({top:0,behavior:"smooth"});
}
["campus","industry","research"].forEach(n=>
  document.getElementById("tab-"+n).addEventListener("click",()=>switchTab(n)));

const h=(location.hash||"").replace("#","");
switchTab(["campus","industry","research"].includes(h)?h:"campus");
</script>
